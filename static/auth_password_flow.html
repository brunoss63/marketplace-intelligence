<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defina sua senha</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: sans-serif;
      color: #F1F5F9;
      background: #0F172A;
    }
    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: clamp(1rem, 4vw, 2rem);
      place-items: center;
      background:
        radial-gradient(ellipse at 18% 10%, rgba(79, 145, 245, .14), transparent 45%),
        #0F172A;
    }
    #mi-auth-password-flow {
      box-sizing: border-box;
      width: min(100%, 30rem);
      padding: clamp(1.25rem, 5vw, 2rem);
      border: 1px solid rgba(148, 163, 184, .2);
      border-radius: 1.25rem;
      background: linear-gradient(145deg, #151F2E, #121C2B);
      box-shadow: 0 24px 64px rgba(0, 0, 0, .3);
    }
    #mi-auth-password-flow h2 {
      margin: 0;
      color: #F8FAFC;
      font-size: clamp(1.5rem, 5vw, 1.9rem);
      letter-spacing: -.03em;
    }
    #mi-auth-password-message {
      color: #CBD5E1;
      line-height: 1.6;
    }
    #mi-auth-password-flow label,
    #mi-auth-password-flow input,
    #mi-auth-password-flow button { display: block; width: 100%; }
    #mi-auth-password-flow label {
      margin-top: 1rem;
      color: #CBD5E1;
      font-size: .9rem;
      font-weight: 600;
    }
    #mi-auth-password-flow input {
      box-sizing: border-box;
      margin-top: .5rem;
      padding: .8rem .9rem;
      border: 1px solid #334155;
      border-radius: .65rem;
      background: #0F172A;
      color: #F1F5F9;
      font: inherit;
    }
    #mi-auth-password-flow input:focus {
      border-color: #4F91F5;
      outline: 3px solid rgba(79, 145, 245, .2);
    }
    #mi-auth-password-submit {
      margin-top: 1.25rem;
      padding: .85rem 1rem;
      border: 0;
      border-radius: .65rem;
      background: #4F91F5;
      color: #071326;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .15s ease, transform .15s ease;
    }
    #mi-auth-password-submit:hover:not(:disabled) {
      background: #70A7FA;
      transform: translateY(-1px);
    }
    #mi-auth-password-submit:disabled {
      cursor: wait;
      opacity: .65;
    }
    #mi-auth-password-flow a {
      color: #93C5FD;
      line-height: 2;
    }
    @media (prefers-reduced-motion: reduce) {
      #mi-auth-password-submit { transition: none; }
    }
  </style>
</head>
<body>
  <main id="mi-auth-password-flow" hidden>
    <h2>Defina sua senha</h2>
    <p id="mi-auth-password-message" role="status">
      Validando o link de acesso...
    </p>
    <form id="mi-auth-password-form" hidden>
      <label for="mi-auth-password">Nova senha</label>
      <input id="mi-auth-password" type="password" minlength="12"
             autocomplete="new-password" required>
      <label for="mi-auth-password-confirm">Confirme a nova senha</label>
      <input id="mi-auth-password-confirm" type="password" minlength="12"
             autocomplete="new-password" required>
      <button id="mi-auth-password-submit" type="submit">
        Salvar senha
      </button>
    </form>
  </main>
  <script src="auth_password_flow.js" defer></script>
</body>
</html>
